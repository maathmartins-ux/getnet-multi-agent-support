name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_PROVIDER: offline
  WEB_SEARCH_PROVIDER: disabled
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: lint + pytest + evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (advisory)
        run: ruff check src tests
        continue-on-error: true

      - name: Unit + regression tests
        run: pytest -q

      - name: Offline evals (routing gate >= 0.9)
        run: python -m evals.run_evals --out evals/results/ci.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/ci.json
          if-no-files-found: warn
          retention-days: 30

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config -q


      - name: Build image
        run: docker build -t getnet-agents .

      - name: Start container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e LLM_PROVIDER=offline -e WEB_SEARCH_PROVIDER=disabled \
            getnet-agents

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo; echo "healthy after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"; exit 1

      - name: Smoke /chat
        run: |
          curl -s -X POST localhost:8000/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"How does Pix work with Getnet?","user_id":"cliente1988"}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['route']['intent']=='getnet_product', d; print('smoke ok', d['agents_involved'])"

      - name: Smoke /metrics
        run: curl -sf http://localhost:8000/metrics | grep -E '^chat_requests_total' || (echo "no chat_requests_total metric"; exit 1)

      - name: Container logs on failure
        if: failure()
        run: docker logs api

      - name: Cleanup
        if: always()
        run: docker rm -f api || true
