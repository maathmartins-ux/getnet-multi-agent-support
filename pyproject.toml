[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getnet-multi-agent-support"
version = "1.0.0"
description = "Multi-agent customer support system for Getnet (Router, Knowledge/RAG, Customer Support, Human Escalation) exposed over FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "anthropic>=2.3,<3",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = ["live: tests that call external services (skipped by default)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
